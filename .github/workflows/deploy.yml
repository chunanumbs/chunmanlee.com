steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Node.js (optional)
    uses: actions/setup-node@v4
    with:
      node-version: '18'

  - name: Install & build if package.json exists
    run: |
      if [ -f package.json ]; then
        echo "package.json found — running npm ci && npm run build (if defined)"
        npm ci --no-audit --prefer-offline || true
        npm run build || echo "npm run build failed or not defined; continuing"
      else
        echo "no package.json — skipping Node build"
      fi

  - name: Determine deploy directory
    id: deploydir
    run: |
      if [ -d "build" ]; then
        echo "deploy_dir=build" >> $GITHUB_OUTPUT
      elif [ -d "dist" ]; then
        echo "deploy_dir=dist" >> $GITHUB_OUTPUT
      elif [ -d "public" ]; then
        echo "deploy_dir=public" >> $GITHUB_OUTPUT
      else
        echo "deploy_dir=." >> $GITHUB_OUTPUT
      fi

  - name: Start ssh-agent and add private key
    uses: webfactory/ssh-agent@v0
    with:
      ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

  - name: Add known_hosts
    run: |
      mkdir -p ~/.ssh
      echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      chmod 600 ~/.ssh/known_hosts

  - name: Rsync to remote server
    env:
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
      REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
    run: |
      DEPLOY_DIR="${{ steps.deploydir.outputs.deploy_dir }}"
      echo "Deploying directory: $DEPLOY_DIR"
      rsync -avz --delete --exclude='.git' -e "ssh -p $REMOTE_PORT -o StrictHostKeyChecking=yes" "$DEPLOY_DIR/" "$REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH"

  - name: Remote post-deploy (listing)
    env:
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
      REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
    run: |
      ssh -p $REMOTE_PORT $REMOTE_USER@$REMOTE_HOST "ls -la $REMOTE_PATH || true"

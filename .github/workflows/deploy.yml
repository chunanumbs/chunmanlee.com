name: Deploy to DreamHost via rsync+SSH

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build (if needed) and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (optional)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & build if package.json exists
        run: |
          if [ -f package.json ]; then
            echo "package.json found — running npm ci && npm run build (if defined)"
            npm ci --no-audit --prefer-offline || true
            npm run build || echo "npm run build failed or not defined; continuing"
          else
            echo "no package.json — skipping Node build"
          fi

      - name: Determine deploy directory
        id: deploydir
        run: |
          if [ -d "build" ]; then
            echo "deploy_dir=build" >> $GITHUB_OUTPUT
          elif [ -d "dist" ]; then
            echo "deploy_dir=dist" >> $GITHUB_OUTPUT
          elif [ -d "public" ]; then
            echo "deploy_dir=public" >> $GITHUB_OUTPUT
          else
            echo "deploy_dir=." >> $GITHUB_OUTPUT
          fi

      - name: Prepare SSH (write key + known_hosts and add to ssh-agent)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          # write private key
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # write known_hosts
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          # start agent and add key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key
          # verify ssh config
          ssh-add -l || true
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes -F /dev/null -p 22 -i ~/.ssh/deploy_key ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} 'echo "SSH connectivity verified"' || true

      - name: Rsync to remote server
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          DEPLOY_DIR="${{ steps.deploydir.outputs.deploy_dir }}"
          echo "Deploying directory: $DEPLOY_DIR"
          rsync -avz --delete --exclude='.git' -e "ssh -i ~/.ssh/deploy_key -p $REMOTE_PORT -o StrictHostKeyChecking=yes" "$DEPLOY_DIR/" "$REMOTE_USER@$REMOTE_HOST:$REMOTE_PATH"

      - name: Remote post-deploy (listing)
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p $REMOTE_PORT $REMOTE_USER@$REMOTE_HOST "ls -la $REMOTE_PATH || true"
